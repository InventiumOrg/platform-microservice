{{- if .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform-microservice.secretName" . }}
  namespace: {{ include "platform-microservice.namespace" . }}
  labels:
    {{- include "platform-microservice.labels" . | nindent 4 }}
  {{- with include "platform-microservice.annotations" . | trim }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
