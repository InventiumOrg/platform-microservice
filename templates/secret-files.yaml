{{- if and .Values.secretFiles.enabled (not .Values.secretFiles.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform-microservice.secretFilesName" . }}
  namespace: {{ include "platform-microservice.namespace" . }}
  labels:
    {{- include "platform-microservice.labels" . | nindent 4 }}
  {{- with include "platform-microservice.annotations" . | trim }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretFiles.files }}
  {{ $key }}: |
{{ $value | indent 4 }}
  {{- end }}
{{- end }}
