{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-microservice.fullname" . }}
  namespace: {{ include "platform-microservice.namespace" . }}
  labels:
    {{- include "platform-microservice.labels" . | nindent 4 }}
  {{- with (merge (dict) (.Values.service.annotations | default dict) (.Values.commonAnnotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.name | default "http" }}
      protocol: {{ .Values.service.protocol | default "TCP" }}
      name: {{ .Values.service.name | default "http" }}
    {{- with .Values.service.extraPorts }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  selector:
    {{- include "platform-microservice.selectorLabels" . | nindent 4 }}
{{- end }}
